[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-data-vault-and-kimball-dwh"
version = "0.1.4"
description = "Lakeflow Declarative Pipelines & PySpark ETL for Data Vault 2.0 and Kimball DWH on Databricks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "mimesis>=18.0.0",
    "pendulum>=3.0.0",
    "loguru>=0.7.3",
    "databricks-labs-dqx>=0.17.0",
    "databricks-sdk>=0.167.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pyspark>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mcp>=1.0.0",
    "ruff>=0.9.0",
    "black>=24.10.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "pydocstyle>=6.3.0",
    "interrogate>=1.7.0",
    "codespell>=2.4.0",
    "yamllint>=1.35.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src/python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/python"]
addopts = "-v --tb=short"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
fail-under = 95
exclude = ["tests", ".venv", "apm_modules"]

[tool.codespell]
skip = ".git,.venv,uv.lock,apm.lock.yaml,apm_modules,secrets.txt"
ignore-words-list = "nd,te,ot,hist,ines,bu"
